        function parseSp500LevelsFromMarkdown(text, timestamp, timeDisplay) {
            if (!text) return [];
            const levels = [];
            const seen = new Set();

            // 1. Key Trading Levels Summary
            const keyMatch = text.match(/###\s*Key\s*Trading\s*Levels\s*Summary[\s\S]*?(?=\n\s*(?:###|---|==|```)|$)/i);
            if (keyMatch) {
                const lines = keyMatch[0].split('\n');
                for (const line of lines) {
                    if (!line.includes('|') || line.includes(':---') || line.includes('Logic / Significance')) continue;
                    const cols = line.split('|').map(c => c.trim()).filter(Boolean);
                    if (cols.length >= 6) {
                        const rawPrice = cols[0].replace(/[^0-9.]/g, '');
                        const tagMatch = cols[2].match(/\[(SP_K?[BS]\d+|K?[BS]\d+)\]/i) || cols[3].match(/\[(SP_K?[BS]\d+|K?[BS]\d+)\]/i);
                        const tag = tagMatch ? '[' + tagMatch[1].toUpperCase() + ']' : '';
                        const isBullish = /\[(SP_KB\d+|KB\d+|SP_B\d+|B\d+)\]/i.test(tag) || cols[0].includes('🟢') || cols[1].toLowerCase().includes('support');
                        const bias = isBullish ? 'bullish' : 'bearish';
                        const key = tag || (rawPrice + '_' + bias);
                        if (rawPrice && !seen.has(key)) {
                            seen.add(key);
                            levels.push({
                                source: 'AI',
                                timestamp: timestamp,
                                timeDisplay: timeDisplay,
                                price: rawPrice,
                                bias: bias,
                                behavior: (tag ? tag + ': ' : '') + (cols[3] || cols[1]),
                                tp: cols[4].replace(/[*_]/g, '').trim() || 'na',
                                sl: cols[5].replace(/[*_]/g, '').trim() || 'na',
                                status: 'na'
                            });
                        }
                    }
                }
            }

            // 2. Action Plan & Triggers table
            const actionMatch = text.match(/###\s*(?:\d+\.\s*)?5-Min\s*\/\s*15-Min\s*Action\s*Plan\s*&\s*Triggers[\s\S]*?(?=\n\s*(?:###|---|==|```)|$)/i);
            if (actionMatch) {
                const lines = actionMatch[0].split('\n');
                for (const line of lines) {
                    if (!line.includes('|') || line.includes(':---') || line.includes('Confirmation Price Action')) continue;
                    const cols = line.split('|').map(c => c.trim()).filter(Boolean);
                    if (cols.length >= 6) {
                        const tagMatch = cols[0].match(/\[(SP_K?[BS]\d+|K?[BS]\d+)\]/i);
                        const tag = tagMatch ? '[' + tagMatch[1].toUpperCase() + ']' : '';
                        const rawPrice = cols[2].split(/[-–]/)[0].replace(/[^0-9.]/g, '');
                        const isBullish = /\[(SP_KB\d+|KB\d+|SP_B\d+|B\d+)\]/i.test(tag) || cols[1].includes('🟢') || cols[1].toLowerCase().includes('long');
                        const bias = isBullish ? 'bullish' : 'bearish';
                        const key = tag || (rawPrice + '_' + bias);
                        if (rawPrice && !seen.has(key)) {
                            seen.add(key);
                            const cleanTp = cols[4].replace(/<br\s*\/?>/gi, ' / ').replace(/[*_]/g, '').trim();
                            const cleanSl = cols[5].replace(/[*_]/g, '').trim();
                            levels.push({
                                source: 'AI',
                                timestamp: timestamp,
                                timeDisplay: timeDisplay,
                                price: rawPrice,
                                bias: bias,
                                behavior: (tag ? tag + ': ' : '') + cols[3],
                                tp: cleanTp || 'na',
                                sl: cleanSl || 'na',
                                status: 'na'
                            });
                        }
                    }
                }
            }

            return levels;
        }

        function getSp500KeyLevels(targetTimestamp = null) {
            let levels = [];
            let timeDisplay = "06:02 PM, Sep 09";
            let anchorTimestamp = null;

            // Normalize target timestamp to milliseconds for distance matching
            let targetMs = null;
            if (targetTimestamp) {
                if (typeof targetTimestamp === 'number') {
                    targetMs = targetTimestamp < 1e11 ? targetTimestamp * 1000 : targetTimestamp;
                } else {
                    const parsed = new Date(targetTimestamp).getTime();
                    if (!isNaN(parsed)) {
                        targetMs = parsed;
                    } else {
                        const num = parseFloat(targetTimestamp);
                        if (!isNaN(num)) targetMs = num < 1e11 ? num * 1000 : num;
                    }
                }
            }

            // 1. Try to extract directly from window.sp500DailyPlanSummary (Markdown text)
            if (window.sp500DailyPlanSummary && Array.isArray(window.sp500DailyPlanSummary) && window.sp500DailyPlanSummary.length > 0) {
                let matchedSummary = null;
                if (targetMs !== null) {
                    let bestDiff = Infinity;
                    window.sp500DailyPlanSummary.forEach(s => {
                        const sMs = new Date(s.timestamp).getTime();
                        if (!isNaN(sMs)) {
                            const diff = Math.min(
                                Math.abs(sMs - targetMs),
                                Math.abs(sMs + (IST_OFFSET_SEC * 1000) - targetMs)
                            );
                            if (diff < bestDiff) {
                                bestDiff = diff;
                                matchedSummary = s;
                            }
                        }
                    });
                } else {
                    matchedSummary = window.sp500DailyPlanSummary[0];
                }

                if (matchedSummary && matchedSummary.text) {
                    const parsed = parseSp500LevelsFromMarkdown(matchedSummary.text, matchedSummary.timestamp, matchedSummary.timeDisplay);
                    if (parsed && parsed.length > 0) {
                        levels = parsed;
                        timeDisplay = matchedSummary.timeDisplay || timeDisplay;
                        anchorTimestamp = matchedSummary.timestamp;
                    }
                }
            }

            // 2. Fallback to window.sp500DailyPlanData if summary did not produce levels
            if (levels.length === 0 && window.sp500DailyPlanData && Array.isArray(window.sp500DailyPlanData) && window.sp500DailyPlanData.length > 0) {
                if (targetMs !== null) {
                    const uniqueTs = [...new Set(window.sp500DailyPlanData.map(i => i.timestamp))];
                    let bestTs = uniqueTs[0];
                    let bestDiff = Infinity;
                    uniqueTs.forEach(ts => {
                        const tsMs = new Date(ts).getTime();
                        if (!isNaN(tsMs)) {
                            const diff = Math.min(
                                Math.abs(tsMs - targetMs),
                                Math.abs(tsMs + (IST_OFFSET_SEC * 1000) - targetMs)
                            );
                            if (diff < bestDiff) {
                                bestDiff = diff;
                                bestTs = ts;
                            }
                        }
                    });
                    anchorTimestamp = bestTs;
                } else {
                    const latestSummaryTs = (window.sp500DailyPlanSummary && Array.isArray(window.sp500DailyPlanSummary) && window.sp500DailyPlanSummary.length > 0)
                        ? window.sp500DailyPlanSummary[0].timestamp
                        : null;

                    if (latestSummaryTs) {
                        const summaryMs = new Date(latestSummaryTs).getTime();
                        const uniqueTs = [...new Set(window.sp500DailyPlanData.map(i => i.timestamp))];
                        let bestTs = uniqueTs[0];
                        let bestDiff = Infinity;
                        uniqueTs.forEach(ts => {
                            const diff = Math.abs(new Date(ts).getTime() - summaryMs);
                            if (diff < bestDiff) { bestDiff = diff; bestTs = ts; }
                        });
                        anchorTimestamp = bestTs;
                    } else {
                        anchorTimestamp = window.sp500DailyPlanData[0]?.timestamp;
                    }
                }

                timeDisplay = window.sp500DailyPlanData.find(i => i.timestamp === anchorTimestamp)?.timeDisplay
                    || window.sp500DailyPlanSummary?.find(s => s.timestamp === anchorTimestamp)?.timeDisplay
                    || window.sp500DailyPlanSummary?.[0]?.timeDisplay
                    || timeDisplay;

                const anchorMs = anchorTimestamp ? new Date(anchorTimestamp).getTime() : null;
                const latestItems = window.sp500DailyPlanData.filter(item => {
                    if (!item) return false;
                    if (item.timestamp === anchorTimestamp) return true;
                    if (anchorMs && item.timestamp) {
                        const itemMs = new Date(item.timestamp).getTime();
                        return Math.abs(itemMs - anchorMs) <= 60000;
                    }
                    return false;
                });
                const keySummaryItems = latestItems.filter(item => /\[SP_(KB|KS|B|S)\d\]/i.test(item.behavior || ''));
                const itemsToFilter = keySummaryItems.length > 0 ? keySummaryItems : latestItems;

                const uniqueTagItems = [];
                const seenTags = new Set();
                itemsToFilter.forEach(item => {
                    const tag = extractTag(item.behavior);
                    if (tag && !seenTags.has(tag)) {
                        seenTags.add(tag);
                        uniqueTagItems.push(item);
                    } else if (!tag) {
                        uniqueTagItems.push(item);
                    }
                });

                levels = uniqueTagItems.length > 0 ? uniqueTagItems : itemsToFilter.slice(0, 4);
            }

            if (levels.length === 0) {
                levels = [
                    { price: "7689.69", bias: "bullish", behavior: "[WED 18:02] [SP_KB2]: 48H Equilibrium Anchor & Institutional Fair Value Mean-Reversion Pivot", tp: "7715.00 / 7735.00", sl: "7678.00" },
                    { price: "7695.00", bias: "bullish", behavior: "[WED 18:02] [SP_B2]: High-Momentum BSL Breakout Trigger: Sustained 5M close above 7695.00", tp: "7715.00 / 7735.00", sl: "7684.00" },
                    { price: "7666.99", bias: "bullish", behavior: "[WED 18:02] [SP_B1]: Demand Floor SSL Sweep Reversal Long (SFP / Turtle Soup)", tp: "7689.69 / 7693.09", sl: "7660.00" },
                    { price: "7756.76", bias: "bearish", behavior: "[WED 18:02] [SP_S1]: Overhead Supply OB / PDH Liquidity Ceiling: SFP Sweep Rejection", tp: "7715.00 / 7693.09", sl: "7764.00" },
                    { price: "7664.00", bias: "bearish", behavior: "[WED 18:02] [SP_S2]: Downside Long-Liquidation Cascade Trigger below 7664.00", tp: "7645.00 / 7611.20", sl: "7674.00" }
                ];
            }

            return { levels, timeDisplay, anchorTimestamp };
        }

        function parseISTTimeToUnix(timeDisplayStr) {
            try {
                const match = timeDisplayStr.match(/(\d+):(\d+)\s*(AM|PM)/i);
                if (!match) return null;
                let hrs = parseInt(match[1]);
                const mins = parseInt(match[2]);
                const ampm = match[3].toUpperCase();
                if (ampm === 'PM' && hrs < 12) hrs += 12;
                if (ampm === 'AM' && hrs === 12) hrs = 0;

                const today = new Date();
                const year = today.getFullYear();
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const day = String(today.getDate()).padStart(2, '0');
                const hrsStr = String(hrs).padStart(2, '0');
                const minsStr = String(mins).padStart(2, '0');

                const isoStr = `${year}-${month}-${day}T${hrsStr}:${minsStr}:00+05:30`;
                return Math.floor(new Date(isoStr).getTime() / 1000);
            } catch (e) {
                return null;
            }
        }

        function extractTag(behaviorStr) {
            if (!behaviorStr) return '';
            const match = behaviorStr.match(/\[(SP_KB\d+|SP_KS\d+|SP_B\d+|SP_S\d+|B\d+|S\d+)\]/i);
            return match ? match[0].toUpperCase() : '';
        }

        function cleanLogicText(behaviorStr) {
            if (!behaviorStr) return '';
            return behaviorStr.replace(/^(?:\[.*?\]\s*)+:\s*/, '').replace(/^(?:\[.*?\]\s*)+/, '');
        }

        function getConfirmationPriceAction(tag, behaviorFallback, summaryArray, targetTimestamp = null) {
            const fallbackText = cleanLogicText(behaviorFallback);
            if (!tag || !summaryArray || !Array.isArray(summaryArray) || summaryArray.length === 0) {
                return fallbackText;
            }

            let summaryItem = summaryArray[0];
            if (targetTimestamp) {
                let targetMs = null;
                if (typeof targetTimestamp === 'number') {
                    targetMs = targetTimestamp < 1e11 ? targetTimestamp * 1000 : targetTimestamp;
                } else {
                    const parsed = new Date(targetTimestamp).getTime();
                    if (!isNaN(parsed)) {
                        targetMs = parsed;
                    } else {
                        const num = parseFloat(targetTimestamp);
                        if (!isNaN(num)) targetMs = num < 1e11 ? num * 1000 : num;
                    }
                }

                if (targetMs !== null) {
                    let bestDiff = Infinity;
                    summaryArray.forEach(item => {
                        if (item && item.timestamp) {
                            const itemMs = new Date(item.timestamp).getTime();
                            const diff = Math.min(
                                Math.abs(itemMs - targetMs),
                                Math.abs(itemMs + (IST_OFFSET_SEC * 1000) - targetMs)
                            );
                            if (diff < bestDiff) {
                                bestDiff = diff;
                                summaryItem = item;
                            }
                        }
                    });
                }
            }

            const latestSummaryText = summaryItem?.text || '';
            if (!latestSummaryText) return fallbackText;

            const cleanTagStr = tag.replace(/[\[\]]/g, '').trim();
            if (!cleanTagStr) return fallbackText;

            const lines = latestSummaryText.split('\n');
            for (let line of lines) {
                if (line.includes('|') && line.toLowerCase().includes(cleanTagStr.toLowerCase())) {
                    const parts = line.split('|').map(p => p.trim());
                    if (parts.length >= 5 && parts[4]) {
                        let confirmation = parts[4];
                        confirmation = confirmation.replace(/<br\s*\/?>/gi, ' ').replace(/\*\*/g, '').trim();
                        confirmation = cleanLogicText(confirmation);
                        if (confirmation && confirmation.length > 8 && !confirmation.toLowerCase().includes('confirmation price action')) {
                            return confirmation;
                        }
                    }
                }
            }
            return fallbackText;
        }

        async function loadRealSp500Candles() {
            const cutoffSec = Math.floor(Date.now() / 1000) - (24 * 3600);
            const filterFresh = (arr) => (arr || []).filter(c => c && c.time && c.time >= cutoffSec);

            // 1. Server-side /api/sp500Ohlc or /api/sp500Candles
            try {
                const res = await fetch(`/api/sp500Ohlc?token=4cfccc84fdff579e101d06092e62a3a0&timeframe=5m&limit=300&_t=${Date.now()}`, { cache: 'no-store' });
                if (res.ok) {
                    const json = await res.json();
                    const candles = filterFresh(json?.candles);
                    if (candles.length > 0) {
                        const latestTs = candles[candles.length - 1].time;
                        const ageMin = (Math.floor(Date.now() / 1000) - latestTs) / 60;
                        if (ageMin <= 45) return candles;
                    }
                }
            } catch (e) {
                console.warn('[SP500 Chart] /api/sp500Ohlc fetch failed:', e);
            }

            // 2. Server-side /api/marketCandles?symbol=SP500
            try {
                const res = await fetch(`/api/marketCandles?symbol=SP500&_t=${Date.now()}`, { cache: 'no-store' });
                if (res.ok) {
                    const json = await res.json();
                    const candles = filterFresh(json?.candles);
                    if (candles.length > 0) {
                        return candles;
                    }
                }
            } catch (e) {
                console.warn('[SP500 Chart] /api/marketCandles fetch failed:', e);
            }

            // 3. Direct Upstream Yahoo Finance (^GSPC) Real Spot Index Mirror
            try {
                const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC?interval=5m&range=1d&_t=${Date.now()}`, { cache: 'no-store' });
                if (res.ok) {
                    const json = await res.json();
                    const result = json?.chart?.result?.[0];
                    if (result && result.timestamp) {
                        const times = result.timestamp;
                        const quote = result.indicators.quote[0];
                        const candles = [];
                        for (let i = 0; i < times.length; i++) {
                            if (quote.open[i] != null && quote.close[i] != null && quote.high[i] != null && quote.low[i] != null) {
                                candles.push({
                                    time: times[i],
                                    open: Number(quote.open[i].toFixed(2)),
                                    high: Number(quote.high[i].toFixed(2)),
                                    low: Number(quote.low[i].toFixed(2)),
                                    close: Number(quote.close[i].toFixed(2))
                                });
                            }
                        }
                        const fresh = filterFresh(candles);
                        if (fresh.length > 0) return fresh;
                    }
                }
            } catch (e) {
                console.warn('[SP500 Chart] Direct Yahoo Finance ^GSPC fetch failed:', e);
            }

            // ⚠️ ZERO SYNTHETIC CANDLE PROTOCOL: Log error to F12 DevTools console
            console.error("[SP500 Chart] F12 ERROR: Real market candle data unavailable from all upstream feeds. ZERO synthetic candles generated.");
            return [];
        }

        function updateFeedStatusBadge(candles) {
            const badge = document.getElementById('feed-status-badge');
            if (!badge) return;

            if (!candles || !Array.isArray(candles) || candles.length === 0) {
                badge.innerText = '⚠️ DATA UNAVAILABLE';
                badge.className = 'feed-badge feed-badge-unavailable';
                return;
            }

            const latestCandleTime = candles[candles.length - 1].time;
            const nowSec = Math.floor(Date.now() / 1000);
            const ageMinutes = (nowSec - latestCandleTime) / 60;

            if (ageMinutes <= 45) {
                badge.innerText = '● LIVE API FEED';
                badge.className = 'feed-badge feed-badge-live';
            } else {
                badge.innerText = '🔒 MARKET CLOSED';
                badge.className = 'feed-badge feed-badge-unavailable';
            }
        }

        function triggerAlertSound(freq = 880, type = 'sine', duration = 0.2) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function showToast(title, body) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-body').innerText = body;
            toast.style.display = 'flex';
            setTimeout(() => { toast.style.display = 'none'; }, 4000);
        }

        let levelCrossingMemory = {};

        function checkCandleCloseCrossings(candles, assetName) {
            if (!alertsEnabled || !candles || candles.length < 2 || !activePriceLines || activePriceLines.length === 0) {
                return;
            }

            const latestCandle = candles[candles.length - 1];
            const currClose = latestCandle.close;

            activePriceLines.forEach(item => {
                const lvlPrice = item.price;
                const tag = item.tag || 'LEVEL';
                const memoryKey = `${tag}_${lvlPrice}`;
                const prevState = levelCrossingMemory[memoryKey];

                let newState = prevState;
                if (currClose >= lvlPrice) {
                    newState = 'above';
                } else {
                    newState = 'below';
                }

                if (!prevState) {
                    levelCrossingMemory[memoryKey] = newState;
                    return;
                }

                if (prevState === 'below' && newState === 'above') {
                    levelCrossingMemory[memoryKey] = 'above';
                    const title = `🚀 ${assetName} Candle Closed ABOVE`;
                    const body = `${assetName} closed at $${currClose.toFixed(2)} ABOVE ${tag} level ($${lvlPrice})`;
                    triggerAlertSound(1046, 'sine', 0.25);
                    showToast(title, body);
                    dispatchDesktopNotification(title, body);
                } else if (prevState === 'above' && newState === 'below') {
                    levelCrossingMemory[memoryKey] = 'below';
                    const title = `🔻 ${assetName} Candle Closed BELOW`;
                    const body = `${assetName} closed at $${currClose.toFixed(2)} BELOW ${tag} level ($${lvlPrice})`;
                    triggerAlertSound(440, 'sine', 0.25);
                    showToast(title, body);
                    dispatchDesktopNotification(title, body);
                }
            });
        }

        function dispatchDesktopNotification(title, body) {
            if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
                try {
                    new Notification(title, {
                        body: body,
                        icon: './icons/icon-192.png'
                    });
                } catch (e) {
                    console.warn("[Chart Alert] Desktop notification failed:", e);
                }
            }
        }
