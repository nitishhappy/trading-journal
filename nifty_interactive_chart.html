                } else if (status === 'failed') {
                    pill.innerText = '🔴 FAILED';
                    pill.style.display = 'inline-block';
                    if (btnFailed) btnFailed.classList.add('active');
                } else {
                    pill.innerText = '';
                    pill.style.display = 'none';
                }
            }
        }

        function updateProximityAndAutoSelect(latestPrice) {
            if (!latestPrice || !activePriceLines || activePriceLines.length === 0) return;

            let nearestIdx = -1;
            let minDistance = Infinity;

            activePriceLines.forEach((item) => {
                const dist = Math.abs(item.price - latestPrice);
                if (dist < minDistance) {
                    minDistance = dist;
                    nearestIdx = item.index;
                }
            });

            document.querySelectorAll('.level-card').forEach(c => c.classList.remove('nearest-proximity'));
            document.querySelectorAll('.proximity-badge').forEach(b => b.style.display = 'none');

            if (nearestIdx !== -1) {
                const nearestCard = document.getElementById(`card-level-${nearestIdx}`);
                const proxBadge = document.getElementById(`prox-badge-nifty-${nearestIdx}`);
                if (nearestCard) nearestCard.classList.add('nearest-proximity');
                if (proxBadge) proxBadge.style.display = 'inline-block';
            }
        }

        function highlightCard(cardIdx) {
            document.querySelectorAll('.level-card').forEach(c => c.classList.remove('selected-highlight'));
            const targetCard = document.getElementById(`card-level-${cardIdx}`);
            if (targetCard) {
                targetCard.classList.add('selected-highlight');
                targetCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                const logicEl = document.getElementById(`card-logic-nifty-${cardIdx}`);
                const btnEl = document.getElementById(`expand-btn-nifty-${cardIdx}`);
                if (logicEl && logicEl.classList.contains('clamped')) {
                    logicEl.classList.remove('clamped');
                    logicEl.classList.add('expanded');
                    if (btnEl) btnEl.innerText = '▲ Collapse Logic';
                }
            }
        }

        function toggleLogicExpand(event, prefix, idx) {
            if (event) event.stopPropagation();
            const logicEl = document.getElementById(`card-logic-${prefix}-${idx}`);
            const btnEl = document.getElementById(`expand-btn-${prefix}-${idx}`);
            if (logicEl) {
                if (logicEl.classList.contains('clamped')) {
                    logicEl.classList.remove('clamped');
                    logicEl.classList.add('expanded');
                    if (btnEl) btnEl.innerText = '▲ Collapse Logic';
                } else {
                    logicEl.classList.remove('expanded');
                    logicEl.classList.add('clamped');
                    if (btnEl) btnEl.innerText = '▼ Show Full Confirmation Logic';
                }
            }
        }

        // Fetch Realtime OHLC Candles from /api/marketCandles?symbol=NIFTY, /api/niftyCandles, or window.niftyCandlesData
        async function fetchRealtimeNiftyCandles() {
            try {
                let planDate = '';
                if (window.dailyPlanData && window.dailyPlanData[0] && window.dailyPlanData[0].timestamp) {
                    planDate = window.dailyPlanData[0].timestamp.split('T')[0];
                }
                const dateParam = planDate ? `&date=${planDate}` : '';

                let res = await fetch(`/api/marketCandles?symbol=NIFTY${dateParam}&_t=${Date.now()}`, { cache: 'no-store' });
                if (!res.ok) {
                    res = await fetch(`/api/niftyCandles?_t=${Date.now()}`, { cache: 'no-store' });
                }
                if (res.ok) {
                    const json = await res.json();
                    if (json && json.candles && Array.isArray(json.candles) && json.candles.length > 0) {
                        const formatted = json.candles.map(c => {
                            let timeSec;
                            let open, high, low, close;

                            if (typeof c === 'object' && c !== null && !Array.isArray(c)) {
                                const tsStr = c.time || c.timestamp || c.timeStr;
                                timeSec = typeof tsStr === 'number' ? tsStr : Math.floor(new Date(tsStr).getTime() / 1000);
                                open = parseFloat(c.open);
                                high = parseFloat(c.high);
                                low = parseFloat(c.low);
                                close = parseFloat(c.close);
                            } else if (Array.isArray(c)) {
                                timeSec = typeof c[0] === 'number' ? c[0] : Math.floor(new Date(c[0]).getTime() / 1000);
                                open = parseFloat(c[1]);
                                high = parseFloat(c[2]);
                                low = parseFloat(c[3]);
                                close = parseFloat(c[4]);
                            }

                            if (isNaN(timeSec) || isNaN(open) || isNaN(high) || isNaN(low) || isNaN(close)) {
                                return null;
                            }

                            return { time: timeSec, open, high, low, close };
                        })
                        .filter(c => c !== null)
                        .sort((a, b) => a.time - b.time);

                        if (formatted.length > 0) return formatted;
                    }
                }
            } catch (e) {
                console.warn("[Candle Feed Error] Could not fetch Nifty candles from API:", e);
            }

            // Fallback: Check local / cached canopy data from window.niftyCandlesData
            try {
                if (typeof reloadCandlesScript === 'function') {
                    await reloadCandlesScript();
                }
                if (window.niftyCandlesData && Array.isArray(window.niftyCandlesData.timeframe5m) && window.niftyCandlesData.timeframe5m.length > 0) {
                    console.log("[Nifty Chart] Loaded candles from window.niftyCandlesData cache");
                    return [...window.niftyCandlesData.timeframe5m];
                }
            } catch (e) {
                console.warn("[Nifty Chart] Fallback candle store error:", e);
            }

            return null;
        }

        function highlightCard(cardIdx) {
            document.querySelectorAll('.level-card').forEach(c => c.classList.remove('selected-highlight'));
            const targetCard = document.getElementById(`card-level-${cardIdx}`);
            if (targetCard) {
                targetCard.classList.add('selected-highlight');
                targetCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function parseNiftyLevelsFromMarkdown(text, timestamp, timeDisplay) {
            if (!text) return [];
            const levels = [];
            const seen = new Set();

            // 1. Table format (if present)
            const actionMatch = text.match(/###\s*(?:\d+\.\s*)?5-Min\s*\/\s*15-Min\s*Action\s*Plan[\s\S]*?(?=\n\s*(?:###|---|==|```)|$)/i);
            const searchBlock = actionMatch ? actionMatch[0] : text;

            const lines = searchBlock.split('\n');
            for (const line of lines) {
                const tagMatch = line.match(/\[([BS]\d+)\]/i);
                if (!tagMatch) continue;
                const tag = '[' + tagMatch[1].toUpperCase() + ']';
                const isBullish = /\[(B\d+)\]/i.test(tag);
                const bias = isBullish ? 'bullish' : 'bearish';

                let rawPrice = '';
                let tp = 'na';
                let sl = 'na';
                let behavior = '';

                if (line.includes('|')) {
                    const parts = line.split('|').map(p => p.trim());
                    // If table row with 6+ cols:
                    if (parts.length >= 6 && !parts.some(p => p.toLowerCase().includes('tp:'))) {
                        rawPrice = parts[2].split(/[-–]/)[0].replace(/[^0-9.]/g, '');
                        behavior = tag + ': ' + parts[3];
                        tp = parts[4].replace(/<br\s*\/?>/gi, ' / ').replace(/[*_]/g, '').trim();
                        sl = parts[5].replace(/[*_]/g, '').trim();
                    } else {
                        // Bullet format: - [B1] ... | TP: ... | SL: ... | ...
                        parts.forEach(p => {
                            const tpMatch = p.match(/TP:\s*([^|]+)/i);
                            if (tpMatch) tp = tpMatch[1].replace(/[*_]/g, '').trim();
                            const slMatch = p.match(/SL:\s*([^|]+)/i);
                            if (slMatch) sl = slMatch[1].replace(/[*_]/g, '').trim();
                        });

                        // Extract price from trigger phrase
                        const priceMatch = line.match(/close\s*(?:back\s*)?(?:ABOVE|BELOW)\s*(?:Day Low\s*)?([0-9,]+(?:\.[0-9]+)?)/i)
                            || line.match(/(?:ABOVE|BELOW)\s*(?:Day Low\s*)?([0-9,]{5,}(?:\.[0-9]+)?)/i)
                            || line.match(/([0-9,]{5,}(?:\.[0-9]+)?)/);

                        if (priceMatch) {
                            rawPrice = priceMatch[1].replace(/,/g, '');
                        }

                        // Clean behavior logic text
                        const colonAfterParen = line.indexOf('):');
                        let entryText = '';
                        if (colonAfterParen !== -1) {
                            entryText = line.substring(colonAfterParen + 2).trim();
                        } else {
                            entryText = line.replace(/^[-*]\s*\[[^\]]+\][^:]*:\s*/, '').trim();
                        }
                        const tpSplit = entryText.indexOf(' | TP:');
                        if (tpSplit !== -1) {
                            entryText = entryText.substring(0, tpSplit).trim();
                        } else {
                            const pIdx = entryText.indexOf(' |');
                            if (pIdx !== -1) entryText = entryText.substring(0, pIdx).trim();
                        }
                        behavior = tag + ': ' + entryText;
                    }
                }

                const key = tag || (rawPrice + '_' + bias);
                if (rawPrice && !seen.has(key)) {
                    seen.add(key);
                    levels.push({
                        source: 'AI',
                        timestamp: timestamp,
                        timeDisplay: timeDisplay,
                        price: rawPrice,
                        bias: bias,
                        behavior: behavior,
                        tp: tp,
                        sl: sl,
                        status: 'na'
                    });
                }
            }

            return levels;
        }

        function getLatestDailyPlanLevels(targetTimestamp = null) {
            let levels = [];
            let timeDisplay = "10:35 AM, Sep 09";
            let anchorTimestamp = null;

            // Normalize target timestamp to milliseconds for distance matching
            let targetMs = null;
            if (targetTimestamp) {
                if (typeof targetTimestamp === 'number') {
                    targetMs = targetTimestamp < 1e11 ? targetTimestamp * 1000 : targetTimestamp;
                } else {
                    const parsed = new Date(targetTimestamp).getTime();
                    if (!isNaN(parsed)) {
                        targetMs = parsed;
                    } else {
                        const num = parseFloat(targetTimestamp);
                        if (!isNaN(num)) targetMs = num < 1e11 ? num * 1000 : num;
                    }
                }
            }

            // 1. Try to extract directly from window.dailyPlanSummary (Markdown text)
            if (window.dailyPlanSummary && Array.isArray(window.dailyPlanSummary) && window.dailyPlanSummary.length > 0) {
                let matchedSummary = null;
                if (targetMs !== null) {
                    let bestDiff = Infinity;
                    window.dailyPlanSummary.forEach(s => {
                        const sMs = new Date(s.timestamp).getTime();
                        if (!isNaN(sMs)) {
                            const diff = Math.min(
                                Math.abs(sMs - targetMs),
                                Math.abs(sMs + (IST_OFFSET_SEC * 1000) - targetMs)
                            );
                            if (diff < bestDiff) {
                                bestDiff = diff;
                                matchedSummary = s;
                            }
                        }
                    });
                } else {
                    matchedSummary = window.dailyPlanSummary[0];
                }

                if (matchedSummary && matchedSummary.text) {
                    const parsed = parseNiftyLevelsFromMarkdown(matchedSummary.text, matchedSummary.timestamp, matchedSummary.timeDisplay);
                    if (parsed && parsed.length > 0) {
                        levels = parsed;
                        timeDisplay = matchedSummary.timeDisplay || timeDisplay;
                        anchorTimestamp = matchedSummary.timestamp;
                    }
                }
            }

            // 2. Fallback to window.dailyPlanData if summary did not produce levels
            if (levels.length === 0 && window.dailyPlanData && Array.isArray(window.dailyPlanData) && window.dailyPlanData.length > 0) {
                if (targetMs !== null) {
                    const uniqueTs = [...new Set(window.dailyPlanData.map(i => i.timestamp))];
                    let bestTs = uniqueTs[0];
                    let bestDiff = Infinity;
                    uniqueTs.forEach(ts => {
                        const tsMs = new Date(ts).getTime();
                        if (!isNaN(tsMs)) {
                            const diff = Math.min(
                                Math.abs(tsMs - targetMs),
                                Math.abs(tsMs + (IST_OFFSET_SEC * 1000) - targetMs)
                            );
                            if (diff < bestDiff) {
                                bestDiff = diff;
                                bestTs = ts;
                            }
                        }
                    });
                    anchorTimestamp = bestTs;
                } else {
                    const latestSummaryTs = (window.dailyPlanSummary && Array.isArray(window.dailyPlanSummary) && window.dailyPlanSummary.length > 0)
                        ? window.dailyPlanSummary[0].timestamp
                        : null;

                    if (latestSummaryTs) {
                        const summaryMs = new Date(latestSummaryTs).getTime();
                        const uniqueTs = [...new Set(window.dailyPlanData.map(i => i.timestamp))];
                        let bestTs = uniqueTs[0];
                        let bestDiff = Infinity;
                        uniqueTs.forEach(ts => {
                            const diff = Math.abs(new Date(ts).getTime() - summaryMs);
                            if (diff < bestDiff) { bestDiff = diff; bestTs = ts; }
                        });
                        anchorTimestamp = bestTs;
                    } else {
                        anchorTimestamp = window.dailyPlanData[0]?.timestamp;
                    }
                }

                timeDisplay = window.dailyPlanData.find(i => i.timestamp === anchorTimestamp)?.timeDisplay
                    || window.dailyPlanSummary?.find(s => s.timestamp === anchorTimestamp)?.timeDisplay
                    || window.dailyPlanSummary?.[0]?.timeDisplay
                    || timeDisplay;

                const anchorMs = anchorTimestamp ? new Date(anchorTimestamp).getTime() : null;
                const latestItems = window.dailyPlanData.filter(item => {
                    if (!item) return false;
                    if (item.timestamp === anchorTimestamp) return true;
                    if (anchorMs && item.timestamp) {
                        const itemMs = new Date(item.timestamp).getTime();
                        return Math.abs(itemMs - anchorMs) <= 60000;
                    }
                    return false;
                });

                // ✅ FIX: Collect ALL levels (KB, KS, B, S) — KB/KS structural first, then B/S action setups.
                const kbKsItems = latestItems.filter(item => /\[K[BS]\d+\]/i.test(item.behavior || ''));
                const bsItems   = latestItems.filter(item => /\[(?!K)[BS]\d+\]/i.test(item.behavior || ''));
                const orderedItems = [...kbKsItems, ...bsItems];

                // Deduplicate by tag — keep first occurrence of each unique tag
                const uniqueTagItems = [];
                const seenTags = new Set();
                orderedItems.forEach(item => {
                    const tag = extractTag(item.behavior);
                    if (tag && !seenTags.has(tag)) {
                        seenTags.add(tag);
                        uniqueTagItems.push(item);
                    } else if (!tag) {
                        uniqueTagItems.push(item);
                    }
                });

                levels = uniqueTagItems.length > 0 ? uniqueTagItems : latestItems;
            }

            if (levels.length === 0) {
                levels = [
                    { price: "23510", bias: "bullish", behavior: "[WED 10:35] [B1]: Pullback into 23,505-23,515 rejected with absorption wick", tp: "23,570 / 23,620", sl: "23,485" },
                    { price: "23555", bias: "bullish", behavior: "[WED 10:35] [B2]: Sustained 5m close ABOVE 23,555 with expanding volume", tp: "23,600 / 23,635", sl: "23,515" },
                    { price: "23550", bias: "bearish", behavior: "[WED 10:35] [S1]: Liquidity probe above 23,550 rejected with exhaustion wick", tp: "23,505 / 23,466", sl: "23,570" },
                    { price: "23505", bias: "bearish", behavior: "[WED 10:35] [S2]: Sustained 5m close BELOW 23,505 with active red volume", tp: "23,466 / 23,420", sl: "23,545" }
                ];
            }

            return { levels, timeDisplay, anchorTimestamp };
        }

        function parseISTTimeToUnix(timeDisplayStr) {
            try {
                const match = timeDisplayStr.match(/(\d+):(\d+)\s*(AM|PM)/i);
                if (!match) return null;
                let hrs = parseInt(match[1]);
                const mins = parseInt(match[2]);
                const ampm = match[3].toUpperCase();
                if (ampm === 'PM' && hrs < 12) hrs += 12;
                if (ampm === 'AM' && hrs === 12) hrs = 0;

                const today = new Date();
                const planTime = new Date(today.getFullYear(), today.getMonth(), today.getDate(), hrs, mins, 0);
                return Math.floor(planTime.getTime() / 1000);
            } catch (e) {
                return null;
            }
        }

        function extractTag(behaviorStr) {
            if (!behaviorStr) return '';
            const match = behaviorStr.match(/\[(B\d+|S\d+|KB\d+|KS\d+)\]/i);
            return match ? match[0].toUpperCase() : '';
        }

        function cleanLogicText(behaviorStr) {
            if (!behaviorStr) return '';
            return behaviorStr.replace(/^(?:\[.*?\]\s*)+:\s*/, '').replace(/^(?:\[.*?\]\s*)+/, '');
        }

        function getConfirmationPriceAction(tag, behaviorFallback, summaryArray, targetTimestamp = null) {
            const fallbackText = cleanLogicText(behaviorFallback);
            if (!tag || !summaryArray || !Array.isArray(summaryArray) || summaryArray.length === 0) {
                return fallbackText;
            }

            let summaryItem = summaryArray[0];
            if (targetTimestamp) {
                let targetMs = null;
                if (typeof targetTimestamp === 'number') {
                    targetMs = targetTimestamp < 1e11 ? targetTimestamp * 1000 : targetTimestamp;
                } else {
                    const parsed = new Date(targetTimestamp).getTime();
                    if (!isNaN(parsed)) {
                        targetMs = parsed;
                    } else {
                        const num = parseFloat(targetTimestamp);
                        if (!isNaN(num)) targetMs = num < 1e11 ? num * 1000 : num;
                    }
                }

                if (targetMs !== null) {
                    let bestDiff = Infinity;
                    summaryArray.forEach(item => {
                        if (item && item.timestamp) {
                            const itemMs = new Date(item.timestamp).getTime();
                            const diff = Math.min(
                                Math.abs(itemMs - targetMs),
                                Math.abs(itemMs + (IST_OFFSET_SEC * 1000) - targetMs)
                            );
                            if (diff < bestDiff) {
                                bestDiff = diff;
                                summaryItem = item;
                            }
                        }
                    });
                }
            }

            const latestSummaryText = summaryItem?.text || '';
            if (!latestSummaryText) return fallbackText;

            const cleanTagStr = tag.replace(/[\[\]]/g, '').trim();  // "B1", "S2", etc.
            if (!cleanTagStr) return fallbackText;

            const lines = latestSummaryText.split('\n');
            for (let line of lines) {
                // ── Pass 1: Markdown table rows (BTC/GOLD format) ──
                // Skip bullet-point lines — they have pipes for TP/SL but are NOT table rows
                const trimmedLine = line.trim();
                if (trimmedLine.match(/^[-*]\s/) ) continue;
                if (line.includes('|') && line.toLowerCase().includes(cleanTagStr.toLowerCase())) {
                    const parts = line.split('|').map(p => p.trim());
                    if (parts.length >= 5 && parts[4]) {
                        let confirmation = parts[4];
                        confirmation = confirmation.replace(/<br\s*\/?>/gi, ' ').replace(/\*\*/g, '').trim();
                        confirmation = cleanLogicText(confirmation);
                        if (confirmation && confirmation.length > 8 && !confirmation.toLowerCase().includes('confirmation price action')) {
                            return confirmation;
                        }
                    }
                }
            }

            // ── Pass 2: Bullet-point lines (NIFTY format) ──
            // Format: - [B1] BUY Setup 1 (Name...): Full entry trigger text... | TP: ... | SL: ...
            for (let line of lines) {
                const trimmed = line.trim();
                if (!trimmed.match(/^[-*]\s*\[/) ) continue;
                if (!trimmed.toLowerCase().includes(`[${cleanTagStr.toLowerCase()}]`)) continue;

                // Extract the full entry trigger condition text
                // It comes after the setup name "): " and before " | TP:"
                let entryText = trimmed;

                // Remove the leading "- [B1] BUY/SELL Setup N (Name): " prefix
                const colonAfterParen = entryText.indexOf('):');
                if (colonAfterParen !== -1) {
                    entryText = entryText.substring(colonAfterParen + 2).trim();
                } else {
                    // Fallback: remove "- [B1] ... : " prefix  
                    entryText = entryText.replace(/^[-*]\s*\[[^\]]+\]\s*(?:BUY|SELL)\s+Setup\s+\d+[^:]*:\s*/i, '');
                }

                // Trim trailing fields after entry trigger: " | TP: ..." onwards
                const tpSplit = entryText.indexOf(' | TP:');
                if (tpSplit !== -1) {
                    entryText = entryText.substring(0, tpSplit).trim();
                }

                // Clean up markdown artifacts
                entryText = entryText.replace(/<br\s*\/?>/gi, ' ').replace(/\*\*/g, '').trim();

                if (entryText && entryText.length > 15) {
                    return entryText;
                }
            }

            return fallbackText;
        }


        async function loadRealNiftyCandles() {
            // Primary: /api/niftyCandles (Upstox 1m feed, aggregated to 5m here)
            try {
                const rawCandles = await fetchRealtimeNiftyCandles();
                if (rawCandles && rawCandles.length > 0) {
                    const buckets = {};
                    rawCandles.forEach(c => {
                        const bTime = Math.floor(c.time / 300) * 300;
                        if (!buckets[bTime]) {
                            buckets[bTime] = { time: bTime, open: c.open, high: c.high, low: c.low, close: c.close };
                        } else {
                            buckets[bTime].high = Math.max(buckets[bTime].high, c.high);
                            buckets[bTime].low = Math.min(buckets[bTime].low, c.low);
                            buckets[bTime].close = c.close;
                        }
                    });
                    const fiveMinCandles = Object.values(buckets).sort((a, b) => a.time - b.time);
                    if (fiveMinCandles.length > 0) return fiveMinCandles;
                }
            } catch (e) {
                console.warn('[Nifty Chart] /api/niftyCandles feed error:', e);
            }
            return [];
        }

        function triggerAlertSound(freq = 880, type = 'sine', duration = 0.2) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function showToast(title, body) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-body').innerText = body;
            toast.style.display = 'flex';
            setTimeout(() => { toast.style.display = 'none'; }, 4000);
        }

        let levelCrossingMemory = {};

        function checkCandleCloseCrossings(candles, assetName) {
            if (!alertsEnabled || !candles || candles.length < 2 || !activePriceLines || activePriceLines.length === 0) {
                return;
            }

            const latestCandle = candles[candles.length - 1];
            const currClose = latestCandle.close;

            activePriceLines.forEach(item => {
                const lvlPrice = item.price;
                const tag = item.tag || 'LEVEL';
                const memoryKey = `${tag}_${lvlPrice}`;
                const prevState = levelCrossingMemory[memoryKey];

                let newState = prevState;
                if (currClose >= lvlPrice) {
                    newState = 'above';
                } else {
                    newState = 'below';
                }

                if (!prevState) {
                    levelCrossingMemory[memoryKey] = newState;
                    return;
                }

                if (prevState === 'below' && newState === 'above') {
                    levelCrossingMemory[memoryKey] = 'above';
                    const title = `🚀 ${assetName} Candle Closed ABOVE`;
                    const body = `${assetName} closed at ₹${currClose.toFixed(2)} ABOVE ${tag} level (₹${lvlPrice})`;
                    triggerAlertSound(1046, 'sine', 0.25);
                    showToast(title, body);
                    dispatchDesktopNotification(title, body);
                } else if (prevState === 'above' && newState === 'below') {
                    levelCrossingMemory[memoryKey] = 'below';
                    const title = `🔻 ${assetName} Candle Closed BELOW`;
                    const body = `${assetName} closed at ₹${currClose.toFixed(2)} BELOW ${tag} level (₹${lvlPrice})`;
                    triggerAlertSound(440, 'sine', 0.25);
                    showToast(title, body);
                    dispatchDesktopNotification(title, body);
                }
            });
        }

        function dispatchDesktopNotification(title, body) {
            if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
                try {
                    new Notification(title, {
                        body: body,
                        icon: './icons/icon-192.png'
                    });
                } catch (e) {
                    console.warn("[Chart Alert] Desktop notification failed:", e);
                }
            }
        }
