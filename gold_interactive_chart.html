        function getGoldActionPlanLevels(targetTimestamp = null) {
            let levels = [];
            let timeDisplay = "06:02 PM, Sep 09";
            let anchorTimestamp = null;

            if (window.goldDailyPlanData && Array.isArray(window.goldDailyPlanData) && window.goldDailyPlanData.length > 0) {
                if (targetTimestamp) {
                    const targetMs = new Date(targetTimestamp).getTime();
                    const uniqueTs = [...new Set(window.goldDailyPlanData.map(i => i.timestamp))];
                    let bestTs = uniqueTs[0];
                    let bestDiff = Infinity;
                    uniqueTs.forEach(ts => {
                        const diff = Math.abs(new Date(ts).getTime() - targetMs);
                        if (diff < bestDiff) { bestDiff = diff; bestTs = ts; }
                    });
                    anchorTimestamp = bestTs;
                } else {
                    const latestSummaryTs = (window.goldDailyPlanSummary && Array.isArray(window.goldDailyPlanSummary) && window.goldDailyPlanSummary.length > 0)
                        ? window.goldDailyPlanSummary[0].timestamp
                        : null;

                    if (latestSummaryTs) {
                        const summaryMs = new Date(latestSummaryTs).getTime();
                        const uniqueTs = [...new Set(window.goldDailyPlanData.map(i => i.timestamp))];
                        let bestTs = uniqueTs[0];
                        let bestDiff = Infinity;
                        uniqueTs.forEach(ts => {
                            const diff = Math.abs(new Date(ts).getTime() - summaryMs);
                            if (diff < bestDiff) { bestDiff = diff; bestTs = ts; }
                        });
                        anchorTimestamp = bestTs;
                    } else {
                        anchorTimestamp = window.goldDailyPlanData[0]?.timestamp;
                    }
                }

                timeDisplay = window.goldDailyPlanData.find(i => i.timestamp === anchorTimestamp)?.timeDisplay
                    || window.goldDailyPlanSummary?.find(s => s.timestamp === anchorTimestamp)?.timeDisplay
                    || window.goldDailyPlanSummary?.[0]?.timeDisplay
                    || timeDisplay;

                const anchorMs = anchorTimestamp ? new Date(anchorTimestamp).getTime() : null;
                const latestItems = window.goldDailyPlanData.filter(item => {
                    if (!item) return false;
                    if (item.timestamp === anchorTimestamp) return true;
                    if (anchorMs && item.timestamp) {
                        const itemMs = new Date(item.timestamp).getTime();
                        return Math.abs(itemMs - anchorMs) <= 60000;
                    }
                    return false;
                });
// ✅ FIX: Collect ALL Gold levels without pre-filtering.
                const uniqueTagItems = [];
                const seenTags = new Set();
                latestItems.forEach(item => {
                    const tag = extractTag(item.behavior);
                    if (tag && !seenTags.has(tag)) {
                        seenTags.add(tag);
                        uniqueTagItems.push(item);
                    } else if (!tag) {
                        uniqueTagItems.push(item);
                    }
                });

                levels = uniqueTagItems.length > 0 ? uniqueTagItems : latestItems;
            }

            if (levels.length === 0) {
                levels = [
                    { price: "4385.00", bias: "bullish", behavior: "[WED 18:02] [G_B1]: Day Low $4,381 SSL Sweep & Bullish Reclaim Trigger", tp: "4396.00 / 4406.00", sl: "4374.00" },
                    { price: "4406.00", bias: "bullish", behavior: "[WED 18:02] [G_B2]: $4,400 Breaker Reclaim & Short-Squeeze Trigger", tp: "4418.00 / 4428.00", sl: "4397.00" },
                    { price: "4400.00-4405.00", bias: "bearish", behavior: "[WED 18:02] [G_S1]: London Breaker Block & Polar Resistance Rejection", tp: "4388.00 / 4381.00", sl: "4410.00" },
                    { price: "4378.00", bias: "bearish", behavior: "[WED 18:02] [G_S2]: Day Low $4,381 Structural Breakdown & Liquidation Cascade", tp: "4368.00 / 4358.00", sl: "4386.00" }
                ];
            }

            return { levels, timeDisplay, anchorTimestamp };
        }

        function parseISTTimeToUnix(timeDisplayStr) {
            try {
                const match = timeDisplayStr.match(/(\d+):(\d+)\s*(AM|PM)/i);
                if (!match) return null;
                let hrs = parseInt(match[1]);
                const mins = parseInt(match[2]);
                const ampm = match[3].toUpperCase();
                if (ampm === 'PM' && hrs < 12) hrs += 12;
                if (ampm === 'AM' && hrs === 12) hrs = 0;

                const today = new Date();
                const year = today.getFullYear();
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const day = String(today.getDate()).padStart(2, '0');
                const hrsStr = String(hrs).padStart(2, '0');
                const minsStr = String(mins).padStart(2, '0');

                const isoStr = `${year}-${month}-${day}T${hrsStr}:${minsStr}:00+05:30`;
                return Math.floor(new Date(isoStr).getTime() / 1000);
            } catch (e) {
                return null;
            }
        }

        function extractTag(behaviorStr) {
            if (!behaviorStr) return '';
            const match = behaviorStr.match(/\[(G_B\d+|G_S\d+|KB\d+|KS\d+|B\d+|S\d+)\]/i);
            return match ? match[0].toUpperCase() : '';
        }

        function cleanLogicText(behaviorStr) {
            if (!behaviorStr) return '';
            return behaviorStr.replace(/^\[.*?\]\s*\[.*?\]:\s*/, '');
        }

        function getConfirmationPriceAction(tag, behaviorFallback, summaryArray, targetTimestamp = null) {
            const fallbackText = cleanLogicText(behaviorFallback);
            if (!tag || !summaryArray || !Array.isArray(summaryArray) || summaryArray.length === 0) {
                return fallbackText;
            }

            let targetSummary = summaryArray[0];
            if (targetTimestamp) {
                const targetMs = new Date(targetTimestamp).getTime();
                let bestDiff = Infinity;
                summaryArray.forEach(s => {
                    const diff = Math.abs(new Date(s.timestamp).getTime() - targetMs);
                    if (diff < bestDiff) { bestDiff = diff; targetSummary = s; }
                });
            }

            const latestSummaryText = targetSummary?.text || '';
            if (!latestSummaryText) return fallbackText;

            const cleanTagStr = tag.replace(/[\[\]]/g, '').trim();
            if (!cleanTagStr) return fallbackText;

            const lines = latestSummaryText.split('\n');
            for (let line of lines) {
                if (line.includes('|') && line.toLowerCase().includes(cleanTagStr.toLowerCase())) {
                    const parts = line.split('|').map(p => p.trim());
                    if (parts.length >= 5 && parts[4]) {
                        let confirmation = parts[4];
                        confirmation = confirmation.replace(/<br\s*\/?>/gi, ' ').replace(/\*\*/g, '').trim();
                        if (confirmation && confirmation.length > 8 && !confirmation.toLowerCase().includes('confirmation price action')) {
                            return confirmation;
                        }
                    }
                }
            }
            return fallbackText;
        }


        function reloadCandlesScript() {
            return new Promise((resolve) => {
                const scriptId = 'dyn-gold-candles-script';
                const oldScript = document.getElementById(scriptId);
                if (oldScript) oldScript.remove();

                const script = document.createElement('script');
                script.id = scriptId;
                script.src = `js/data/gold_candles.js?t=${Date.now()}`;
                script.onload = () => resolve(true);
                script.onerror = () => resolve(false);
                document.body.appendChild(script);
            });
        }

        async function loadRealGoldCandles(levels) {
            // Dynamically refresh local Vantage MT5 candle store
            await reloadCandlesScript();

            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const tfKey = currentTf === '15m' ? 'timeframe15m' : 'timeframe5m';
            const barSec = currentTf === '15m' ? 900 : 300;

            // 1. Primary Feed: Vantage MT5 from window.goldCandlesData (gold_market_data.db)
            if (window.goldCandlesData && Array.isArray(window.goldCandlesData[tfKey]) && window.goldCandlesData[tfKey].length > 0) {
                const candles = window.goldCandlesData[tfKey];
                const latestCandleTime = candles[candles.length - 1].time - IST_OFFSET_SEC;
                const nowSec = Math.floor(Date.now() / 1000);
                const ageMinutes = (nowSec - latestCandleTime) / 60;

                // On localhost, Vantage exporter runs live. If age is within 5 minutes on localhost:
                if (isLocal && ageMinutes <= 5) {
                    currentFeedSource = window.goldCandlesData.source || 'VANTAGE_MT5';
                    return candles;
                }
            }

            // 2. Real-Time Spot Ingestion from Swissquote (via CORS-enabled server endpoints)
            let liveSpot = null;

            // A. Fetch from /api/livePrices (direct Swissquote proxy on backend, with CORS *)
            const livePricesUrl = isLocal
                ? 'https://trading-journal-sandy-three.vercel.app/api/livePrices'
                : '/api/livePrices';
            try {
                const lpRes = await fetch(`${livePricesUrl}?_t=${Date.now()}`, { cache: 'no-store' });
                if (lpRes.ok) {
                    const lpJson = await lpRes.json();
                    if (lpJson && typeof lpJson.xauusd === 'number' && lpJson.xauusd > 0) {
                        liveSpot = lpJson.xauusd;
                    }
                }
            } catch (e) {
                console.warn('[Gold Chart] /api/livePrices fetch note:', e);
            }

            // B. Fallback to /api/marketCandles?symbol=GOLD
            if (!liveSpot) {
                const marketCandlesUrl = isLocal
                    ? `https://trading-journal-sandy-three.vercel.app/api/marketCandles?symbol=GOLD&timeframe=${currentTf}&_t=${Date.now()}`
                    : `/api/marketCandles?symbol=GOLD&timeframe=${currentTf}&_t=${Date.now()}`;
                try {
                    const mcRes = await fetch(marketCandlesUrl, { cache: 'no-store' });
                    if (mcRes.ok) {
                        const mcJson = await mcRes.json();
                        if (mcJson && Array.isArray(mcJson.candles) && mcJson.candles.length > 0) {
                            if (mcJson.candles.length > 5) {
                                currentFeedSource = mcJson.source || 'VANTAGE_MT5';
                                return mcJson.candles;
                            }
                            liveSpot = mcJson.candles[mcJson.candles.length - 1].close;
                        }
                    }
                } catch (e) {
                    console.warn('[Gold Chart] /api/marketCandles fallback note:', e);
                }
            }

            // 3. Anchor & Synthesize Live Forming Candle from Swissquote Spot
            if (liveSpot && window.goldCandlesData && Array.isArray(window.goldCandlesData[tfKey]) && window.goldCandlesData[tfKey].length > 0) {
                const baseCandles = window.goldCandlesData[tfKey].map(c => ({...c}));
                const nowSec = Math.floor(Date.now() / 1000);
                const currentBarTime = (Math.floor(nowSec / barSec) * barSec) + IST_OFFSET_SEC;
                const lastCandle = baseCandles[baseCandles.length - 1];

                if (lastCandle && lastCandle.time === currentBarTime) {
                    // Update active candle tick
                    lastCandle.high = Math.max(lastCandle.high, liveSpot);
                    lastCandle.low = Math.min(lastCandle.low, liveSpot);
                    lastCandle.close = liveSpot;
                } else if (lastCandle && currentBarTime > lastCandle.time) {
                    // New bar has opened
                    const openPrice = lastCandle.close;
                    baseCandles.push({
                        time: currentBarTime,
                        open: openPrice,
                        high: Math.max(openPrice, liveSpot),
                        low: Math.min(openPrice, liveSpot),
                        close: liveSpot,
                        volume: 1
                    });
                }
                currentFeedSource = 'SWISSQUOTE_BBO';
                return baseCandles;
            }

            // 4. Offline Base Fallback (if cloud API is completely unreachable)
            if (window.goldCandlesData && Array.isArray(window.goldCandlesData[tfKey]) && window.goldCandlesData[tfKey].length > 0) {
                currentFeedSource = 'VANTAGE_OFFLINE';
                return window.goldCandlesData[tfKey];
            }

            // ⚠️ ZERO SYNTHETIC CANDLE PROTOCOL: Log error to F12 DevTools console
            console.error("[Gold Chart] F12 ERROR: Real market candle data unavailable from Vantage MT5 & Swissquote. ZERO synthetic candles generated.");
            return [];
        }

        function updateFeedStatusBadge(candles) {
            const badge = document.getElementById('feed-status-badge');
            const localLink = document.getElementById('local-server-link');
            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

            if (localLink) {
                localLink.style.display = (!isLocal) ? 'inline-flex' : 'none';
            }

            if (!badge) return;

            if (!candles || !Array.isArray(candles) || candles.length === 0) {
                badge.innerText = '⚠️ DATA UNAVAILABLE';
                badge.className = 'feed-badge feed-badge-unavailable';
                return;
            }

            const latestCandleTime = candles[candles.length - 1].time - IST_OFFSET_SEC; // Convert back to real UTC
            const nowSec = Math.floor(Date.now() / 1000);
            const ageMinutes = (nowSec - latestCandleTime) / 60;

            if (currentFeedSource === 'SWISSQUOTE_BBO') {
                badge.innerText = `● SWISSQUOTE SPOT (${currentTf.toUpperCase()})`;
                badge.className = 'feed-badge feed-badge-live';
                return;
            }

            if (currentFeedSource === 'VANTAGE_OFFLINE') {
                badge.innerText = `⚠️ OFFLINE SNAPSHOT (${ageMinutes > 60 ? Math.round(ageMinutes/60) + 'h ago' : Math.round(ageMinutes) + 'm ago'})`;
                badge.className = 'feed-badge feed-badge-unavailable';
                return;
            }

            if (ageMinutes <= 60) {
                badge.innerText = `● VANTAGE MT5 (${currentTf.toUpperCase()})`;
                badge.className = 'feed-badge feed-badge-live';
            } else {
                badge.innerText = '🔒 MARKET CLOSED';
                badge.className = 'feed-badge feed-badge-unavailable';
            }
        }

        function triggerAlertSound(freq = 880, type = 'sine', duration = 0.2) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function showToast(title, body) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-body').innerText = body;
            toast.style.display = 'flex';
            setTimeout(() => { toast.style.display = 'none'; }, 4000);
        }

        let levelCrossingMemory = {};

        function checkCandleCloseCrossings(candles, assetName) {
            if (!alertsEnabled || !candles || candles.length < 2 || !activePriceLines || activePriceLines.length === 0) {
                return;
            }

            const latestCandle = candles[candles.length - 1];
            const currClose = latestCandle.close;

            activePriceLines.forEach(item => {
                const lvlPrice = item.price;
                const tag = item.tag || 'LEVEL';
                const memoryKey = `${tag}_${lvlPrice}`;
                const prevState = levelCrossingMemory[memoryKey];

                let newState = prevState;
                if (currClose >= lvlPrice) {
                    newState = 'above';
                } else {
                    newState = 'below';
                }

                if (!prevState) {
                    levelCrossingMemory[memoryKey] = newState;
                    return;
                }

                if (prevState === 'below' && newState === 'above') {
                    levelCrossingMemory[memoryKey] = 'above';
                    const title = `🚀 ${assetName} Candle Closed ABOVE`;
                    const body = `${assetName} closed at $${currClose.toFixed(2)} ABOVE ${tag} level ($${lvlPrice})`;
                    triggerAlertSound(1046, 'sine', 0.25);
                    showToast(title, body);
                    dispatchDesktopNotification(title, body);
                } else if (prevState === 'above' && newState === 'below') {
                    levelCrossingMemory[memoryKey] = 'below';
                    const title = `🔻 ${assetName} Candle Closed BELOW`;
                    const body = `${assetName} closed at $${currClose.toFixed(2)} BELOW ${tag} level ($${lvlPrice})`;
                    triggerAlertSound(440, 'sine', 0.25);
                    showToast(title, body);
                    dispatchDesktopNotification(title, body);
                }
            });
        }

        function dispatchDesktopNotification(title, body) {
            if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
                try {
                    new Notification(title, {
                        body: body,
                        icon: './icons/icon-192.png'
                    });
                } catch (e) {
                    console.warn("[Chart Alert] Desktop notification failed:", e);
                }
            }
        }
